  adventurer:
    title: "Adventurer"
    icon: COMPASS
    blurb: "Dungeons, legends, companions and magic: you go out and find things."
    systems: [NexusDungeons, NexusLegends, NexusExpeditions, NexusCompanions, NexusHatchlings, NexusWarbeasts, NexusPortals, NexusMomentum, NexusMagic, NexusWands, NexusEnchants, NexusLode, NexusGrave, NexusMinds, NexusGiants, NexusEvents, NexusMobCrossbow]
  survivor:
    title: "Survivor"
    icon: CAMPFIRE
    blurb: "Hard mode: thirst, injury, cold, nights that matter and a world that fights back."
    systems: [NexusSurvival, NexusVitals, NexusHydro, NexusIntegrity, NexusHorror, NexusSomnus, NexusRime, NexusGrave, NexusMinds, NexusGiants, NexusMigrations, NexusWards, NexusRequiem, NexusUndertow, NexusEvents, NexusCombat, NexusCuisine, NexusForge, NexusWeatherReport]
  warrior:
    title: "Warrior & Politician"
