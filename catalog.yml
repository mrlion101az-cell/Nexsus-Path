# NexusPath catalog: the systems a player can choose between, and the play styles that bundle them.
#
# A SYSTEM is one Nexus plugin (its id is the plugin's name). A STYLE is a named bundle of systems.
# This file ships inside the jar and is replaced when the plugin updates. To change anything, edit
# plugins/NexusPath/custom-catalog.yml instead (it is explained there) and run /path reload.
#
# Per system:
#   name / icon / blurb   what the picker shows
#   locked: true          always on for everybody (safety, claims, money, moderation, staff tools): never hidden
#   world: true           shared with everyone; hiding it only stops what the player does themselves
#   events: false         do not gate this plugin's event handlers for hidden players (commands are still hidden)
#   default: true         on for everyone unless they turn it off, whatever styles they pick

systems:

  # --- Getting Started
  NexusMenu:
    name: "Nexus Hub and Codex"
    icon: ENCHANTED_BOOK
    blurb: "One menu that reaches every system on the server, no commands needed."
    locked: true
  NexusStarter:
    name: "Your Starter Guide"
    icon: COMPASS
    blurb: "A guide book and menu that explains every system on the server."
    locked: true
  NexusSeasons:
    name: "Seasons & Weather"
